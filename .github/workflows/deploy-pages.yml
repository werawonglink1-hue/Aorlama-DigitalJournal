name: Deploy xauusd-dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "xauusd-dashboard/web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload dashboard as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: xauusd-dashboard/web
      - name: Wait for artifact to be indexed
        # actions/deploy-pages sometimes queries the artifact API before the just-
        # uploaded artifact is indexed, failing with "Found 0 artifact(s)" even though
        # the upload step above succeeded. A short pause avoids the race.
        run: sleep 15
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
