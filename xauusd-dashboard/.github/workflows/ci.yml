name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for accidental secrets in diff
        run: |
          if git grep -nE "(SUPABASE_SERVICE_ROLE_KEY|EXNESS_API_KEY)\s*=\s*['\"][A-Za-z0-9]" -- . ':!*.example.*' ':!docs/*'; then
            echo "Possible hardcoded secret found — see docs/SOP.md (secrets belong only in a cloud secret manager)."
            exit 1
          fi

      - name: Validate SQL migration is present
        run: test -f supabase/migrations/0001_init.sql

      - name: Validate web assets are present
        run: test -f web/index.html && test -f web/app.js
